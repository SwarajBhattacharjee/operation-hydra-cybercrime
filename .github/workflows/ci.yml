name: CI - Docs & Structure Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md

  structure-check:
    name: Directory Structure Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files and folders exist
        run: |
          required=(
            "README.md"
            "docs/report/Operation_Hydra_Report.md"
            "phishing-spoofing/analysis.md"
            "malware-analysis/payload-simulation.md"
            "malware-analysis/iocs.md"
            "financial-fraud/tracing-analysis.md"
            "financial-fraud/transaction-logs/sample_transactions.csv"
            "scripts/whois_lookup.py"
            "scripts/ip_trace.py"
            "scripts/log_parser.py"
            "tools/tools-used.md"
          )
          missing=0
          for f in "${required[@]}"; do
            if [ ! -e "$f" ]; then
              echo "::error::Missing required deliverable: $f"
              missing=1
            else
              echo "OK: $f"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "One or more required deliverables are missing."
            exit 1
          fi
          echo "All required deliverables are present."

      - name: Python syntax check for scripts
        run: |
          python3 -m py_compile scripts/*.py
          echo "All scripts compile cleanly."
